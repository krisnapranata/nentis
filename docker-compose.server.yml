version: '3.8'

services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-nentis}
      MYSQL_USER: ${DB_USER:-sik}
      MYSQL_PASSWORD: ${DB_PASSWORD:-00}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ubah-ini-password-root}
    volumes:
      - nentis_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers 3"
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-nentis}
      - DB_USER=${DB_USER:-sik}
      - DB_PASSWORD=${DB_PASSWORD:-00}
      - DB_PORT=3306
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMISI_USERNAME=${ADMISI_USERNAME:-admisi}
      - ADMISI_PASSWORD=${ADMISI_PASSWORD:-admisi123}
      - DOKTER_USERNAME=${DOKTER_USERNAME:-dokter}
      - DOKTER_PASSWORD=${DOKTER_PASSWORD:-dokter123}
    volumes:
      - nentis_media_data:/app/media
      - nentis_static_data:/app/staticfiles

volumes:
  nentis_db_data:
  nentis_media_data:
  nentis_static_data:

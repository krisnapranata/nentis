services:
  db:
    image: mariadb:10.6
    container_name: nentis_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-nentis}
      MYSQL_USER: ${DB_USER:-sik}
      MYSQL_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD di .env}
    volumes:
      - nentis_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: nentis-web:latest
    build: .
    container_name: nentis_web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers 3 --timeout 60 --access-logfile -"
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - nentis_media_data:/app/media
      - nentis_static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8002/daftar/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  nentis_db_data:
  nentis_media_data:
  nentis_static_data:

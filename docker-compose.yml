version: '3.8'

services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-nentis}
      MYSQL_USER: ${DB_USER:-sik}
      MYSQL_PASSWORD: ${DB_PASSWORD:-00}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers 3"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8002:8002"
    depends_on:
      - db
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-nentis}
      - DB_USER=${DB_USER:-sik}
      - DB_PASSWORD=${DB_PASSWORD:-00}
      - DB_PORT=3306
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMISI_USERNAME=${ADMISI_USERNAME:-admisi}
      - ADMISI_PASSWORD=${ADMISI_PASSWORD:-admisi123}
      - DOKTER_USERNAME=${DOKTER_USERNAME:-dokter}
      - DOKTER_PASSWORD=${DOKTER_PASSWORD:-dokter123}

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/staticfiles
      - media_volume:/media
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  mariadb_data:
  static_volume:
  media_volume:

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Antrian - Klinik Gigi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0a0e27 100%);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .display-header {
            background: linear-gradient(90deg, #1a5c5c, #2c7a7b);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(44,122,123,0.3);
        }
        .display-header h1 { font-size: 2rem; margin: 0; font-weight: 700; letter-spacing: 2px; }
        .display-header .date { font-size: 1.2rem; opacity: 0.9; }
        .panggil-section {
            background: linear-gradient(135deg, #28a745, #20c997);
            margin: 20px 40px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(40,167,69,0.4);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 30px rgba(40,167,69,0.4); }
            50% { box-shadow: 0 4px 50px rgba(40,167,69,0.7); }
        }
        .panggil-nomor {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: -4px;
            line-height: 1;
        }
        .panggil-nama {
            font-size: 2rem;
            margin-top: 10px;
            opacity: 0.95;
        }
        .queue-section {
            margin: 20px 40px 40px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .queue-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            min-width: 160px;
            flex: 1;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .queue-card.status-menunggu { opacity: 0.6; }
        .queue-card.status-dipanggil {
            background: rgba(40,167,69,0.3);
            border-color: rgba(40,167,69,0.6);
            opacity: 1;
            animation: flicker 0.5s ease-in-out 3;
        }
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .queue-number {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -2px;
        }
        .queue-name {
            font-size: 1.3rem;
            margin: 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .queue-status {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            opacity: 0.5;
            font-size: 1.2rem;
        }
        #spinner { text-align: center; padding: 5px; }
        .htmx-indicator { opacity: 0; transition: opacity 0.2s; }
        .htmx-request .htmx-indicator { opacity: 1; }

        @media (max-width: 768px) {
            .display-header { padding: 15px 20px; }
            .display-header h1 { font-size: 1.3rem; }
            .panggil-section { margin: 10px 15px; padding: 20px; }
            .panggil-nomor { font-size: 4rem; }
            .queue-section { margin: 10px 15px; gap: 10px; }
            .queue-card { min-width: 120px; padding: 12px; }
            .queue-number { font-size: 2rem; }
            .queue-name { font-size: 0.9rem; }
        }
    </style>
</head>
<body
    hx-get="{% url 'display_rows' %}"
    hx-trigger="every 5s"
    hx-target="#display-content"
    hx-swap="innerHTML"
    hx-indicator="#spinner"
>
    <div class="display-header">
        <h1>KLINIK GIGI</h1>
        <div class="date">{{ today|date:"l, d F Y" }}</div>
    </div>

    <div id="display-content">
        {% include "antrian/_display_rows.html" %}
    </div>

    <div id="spinner" class="htmx-indicator">
        <div class="spinner-border spinner-border-sm text-light" role="status"></div>
    </div>

    <script>
        let previousDipanggil = new Set();
        let audioCtx = null;

        function playBell() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;

            const frequencies = [880, 1100, 1320];
            frequencies.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, now + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.15);
                osc.stop(now + i * 0.15 + 0.3);
            });
        }

        function speak(nomor, nama) {
            if (!('speechSynthesis' in window)) return;
            const text = 'Nomor antrian ' + nomor + ', atas nama ' + nama + ', silakan menuju ruang pemeriksaan.';
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'id-ID';
            utter.rate = 0.95;
            utter.pitch = 1;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utter);
        }

        document.body.addEventListener('htmx:afterSettle', function() {
            const currentDipanggil = new Set();
            document.querySelectorAll('.queue-card.status-dipanggil').forEach(card => {
                const id = card.dataset.antrianId;
                currentDipanggil.add(id);
                if (!previousDipanggil.has(id)) {
                    playBell();
                    const nomor = card.querySelector('.queue-number').textContent.trim();
                    const nama = card.querySelector('.queue-name').textContent.trim();
                    speak(nomor, nama);
                }
            });
            previousDipanggil = currentDipanggil;
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'f' || e.key === 'F') {
                document.documentElement.requestFullscreen();
            }
        });
    </script>
</body>
</html>

{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-header text-center py-3">
                <h5 class="mb-0"><i class="bi bi-qr-code-scan me-2"></i>Check-in Pasien</h5>
            </div>
            <div class="card-body p-4">
                <p class="text-muted small">Masukkan kode pendaftaran atau NIK Anda untuk check-in.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Kode Pendaftaran</label>
                        <input type="text" name="kode_pendaftaran" class="form-control" placeholder="Contoh: REG-20260723-0001">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Atau No. KTP/NIK</label>
                        <input type="text" name="no_ktp" class="form-control" placeholder="Masukkan NIK Anda">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle me-1"></i> Check-in
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Dashboard Dokter{% endblock %}

{% block content %}
<h4 class="mb-4"><i class="bi bi-speedometer2 me-2"></i>Dashboard Dokter</h4>

<div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
        <div class="card text-center">
            <div class="card-body py-3">
                <h6 class="text-muted small">Menunggu</h6>
                <h3 class="mb-0 text-warning">{{ menunggu }}</h3>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card text-center">
            <div class="card-body py-3">
                <h6 class="text-muted small">Dipanggil</h6>
                <h3 class="mb-0 text-primary">{{ dipanggil }}</h3>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card text-center">
            <div class="card-body py-3">
                <h6 class="text-muted small">Diperiksa</h6>
                <h3 class="mb-0 text-info">{{ diperiksa }}</h3>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card text-center">
            <div class="card-body py-3">
                <h6 class="text-muted small">Selesai</h6>
                <h3 class="mb-0 text-success">{{ selesai }}</h3>
            </div>
        </div>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-6">
        <a href="{% url 'dokter_antrian' %}" class="card text-decoration-none h-100">
            <div class="card-body text-center py-4">
                <i class="bi bi-list-ol fs-1 text-primary"></i>
                <h6 class="mt-2">Lihat Pasien Menunggu</h6>
            </div>
        </a>
    </div>
</div>
{% endblock %}
